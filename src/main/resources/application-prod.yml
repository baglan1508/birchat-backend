spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: birchat
        format_sql: false

  flyway:
    enabled: true
    schemas: birchat
    default-schema: birchat
    locations: classpath:db/migration
    baseline-on-migrate: true

storage:
  supabase:
    url: ${SUPABASE_URL}
    service-key: ${SUPABASE_SERVICE_KEY}
    bucket: ${SUPABASE_BUCKET:birchat-files}

auth:
  sms:
    code-ttl-seconds: ${AUTH_SMS_CODE_TTL_SECONDS:300}
    resend-cooldown-seconds: ${AUTH_SMS_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${AUTH_SMS_MAX_ATTEMPTS:5}
    demo-phone: ${AUTH_SMS_DEMO_PHONE}
    demo-code: ${AUTH_SMS_DEMO_CODE}
    otp-secret: ${AUTH_SMS_OTP_SECRET}

sms:
  provider: ${SMS_PROVIDER:smsc}

  smsc:
    login: ${SMSC_LOGIN:}
    password: ${SMSC_PASSWORD:}
    api-key: ${SMSC_API_KEY:}
    sender: ${SMSC_SENDER:}
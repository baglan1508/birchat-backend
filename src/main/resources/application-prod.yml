spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Neon (serverless Postgres) засыпает после простоя и рвёт соединения.
    # Пул не держит соединения без нужды (Neon может уснуть и не тратить compute),
    # проверяет соединение перед выдачей и терпит холодный старт базы.
    hikari:
      pool-name: birchat-db
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: 120000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: 60000
      data-source-properties:
        ApplicationName: birchat-backend
        tcpKeepAlive: true
        connectTimeout: 15
        socketTimeout: 120

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: birchat
        format_sql: false

  flyway:
    enabled: true
    schemas: birchat
    default-schema: birchat
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 5
    connect-retries-interval: 5

storage:
  supabase:
    url: ${SUPABASE_URL}
    service-key: ${SUPABASE_SERVICE_KEY}
    bucket: ${SUPABASE_BUCKET:birchat-files}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_JWT_ISSUER:birchat}
    access-ttl-seconds: ${AUTH_JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-days: ${AUTH_JWT_REFRESH_TTL_DAYS:30}
  sms:
    code-ttl-seconds: ${AUTH_SMS_CODE_TTL_SECONDS:300}
    resend-cooldown-seconds: ${AUTH_SMS_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${AUTH_SMS_MAX_ATTEMPTS:5}
    demo-phone: ${AUTH_SMS_DEMO_PHONE}
    demo-code: ${AUTH_SMS_DEMO_CODE}
    otp-secret: ${AUTH_SMS_OTP_SECRET}
    # Временно до запуска: одинаковый код для всех номеров. Пусто — выключено.
    fixed-code: ${AUTH_SMS_FIXED_CODE:}

otp:
  # telegram — Telegram Gateway; disabled — только demo-номер; console — только для локальной разработки
  provider: ${OTP_PROVIDER:telegram}
  telegram:
    access-token: ${TELEGRAM_GATEWAY_TOKEN:}
    base-url: ${TELEGRAM_GATEWAY_BASE_URL:https://gatewayapi.telegram.org}
    sender-username: ${TELEGRAM_GATEWAY_SENDER_USERNAME:}

ai:
  provider: ${AI_PROVIDER:mock}
  glm:
    api-key: ${AI_GLM_API_KEY:}
    model: ${AI_GLM_MODEL:glm-4.5-air}
    base-url: ${AI_GLM_BASE_URL:https://api.z.ai/api/paas/v4}
    max-tokens: ${AI_GLM_MAX_TOKENS:1024}
    temperature: ${AI_GLM_TEMPERATURE:0.6}
  summary:
    interval-hours: ${AI_SUMMARY_INTERVAL_HOURS:3}
    max-messages: ${AI_SUMMARY_MAX_MESSAGES:100}
    max-message-length: ${AI_SUMMARY_MAX_MESSAGE_LENGTH:500}
    cron: ${AI_SUMMARY_CRON:0 0 */3 * * *}
    zone: ${AI_SUMMARY_ZONE:Asia/Almaty}
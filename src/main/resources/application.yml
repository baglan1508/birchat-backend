server:
  port: ${PORT:8080}

spring:
  application:
    name: birchat-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    # Соединение с базой держится только на время транзакции, а не всего HTTP-запроса.
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

otp:
  provider: ${OTP_PROVIDER:console}

# Ночная чистка служебных данных (окна AI-квот, старые refresh-токены и коды входа).
# Сроки хранения можно переопределить: cleanup.quota-minute-retention, quota-day-retention,
# refresh-token-retention, auth-code-retention (например 7d, 30d).
cleanup:
  enabled: ${CLEANUP_ENABLED:true}
  cron: ${CLEANUP_CRON:0 10 4 * * *}

# Мониторинг ошибок. Пустой SENTRY_DSN — Sentry выключен (локально и до настройки).
# В Sentry уходят записи лога уровня ERROR: ошибки 5xx API и сбои фоновых задач.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  release: ${RENDER_GIT_COMMIT:}
  send-default-pii: false
  max-request-body-size: none
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

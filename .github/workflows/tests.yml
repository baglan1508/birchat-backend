# Юнит-тесты на каждый PR и push в develop/main.
# Сборка на Render идёт с -DskipTests (быстрый деплой), поэтому тесты гоняются здесь.
# Секреты не нужны. Тест миграций запускается на чистом PostgreSQL 18 (как в Neon)
# из контейнера ниже; без переменной MIGRATION_TEST_DB_URL (локально) он пропускается.
name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: birchat_ci
          POSTGRES_USER: birchat
          POSTGRES_PASSWORD: birchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U birchat -d birchat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test
        env:
          MIGRATION_TEST_DB_URL: jdbc:postgresql://localhost:5432/birchat_ci
          MIGRATION_TEST_DB_USER: birchat
          MIGRATION_TEST_DB_PASSWORD: birchat
